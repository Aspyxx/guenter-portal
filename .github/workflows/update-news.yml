name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nachrichten ermitteln
        run: python scripts/update_news.py

      - name: JSON und Tests prüfen
        run: |
          python -m json.tool news.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Geänderte Daten veröffentlichen
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json ist unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Aktualisiere Nachrichten"
          git push
