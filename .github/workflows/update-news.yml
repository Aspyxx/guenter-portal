name: Nachrichten aktualisieren

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Remote-Stand synchronisieren
        run: |
          # Vor der Pipeline synchronisieren, solange der Checkout sauber ist.
          git fetch origin main
          git rebase origin/main

      - name: Nachrichten ermitteln
        run: python scripts/update_news.py

      - name: JSON und Tests prüfen
        run: |
          python -m json.tool news.json > /dev/null
          python -m unittest discover -s tests -v

      - name: Geänderte Daten veröffentlichen
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json ist unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Aktualisiere Nachrichten"

          # Ein Push kann kurzfristig an einem gleichzeitig eingetroffenen
          # Remote-Commit scheitern. In diesem Fall wird der aktuelle Stand
          # erneut eingeholt und ohne Force-Push erneut versucht.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push nach 3 Versuchen fehlgeschlagen."
              exit 1
            fi
            echo "Push fehlgeschlagen; synchronisiere Commit vor Versuch $((attempt + 1))."
            git fetch origin main
            git rebase origin/main
          done
